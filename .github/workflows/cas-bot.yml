name: CAS Bot

on:
  schedule:
    - cron: "30 1 * * *"                    # 7:00 AM IST  -> scan & queue
    - cron: "30 2,4,6,8,10,12,14 * * *"     # 8,10,12, 2,4,6,8 PM IST -> send a few
  workflow_dispatch:                         # manual run from Actions tab (scan + send)

permissions:
  contents: write

concurrency:
  group: cas-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bot
        run: python bot.py
        env:
          SCHEDULE: ${{ github.event.schedule }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save state
        run: |
          git config user.name "cas-bot"
          git config user.email "cas-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update state"
          git pull --rebase
          git push
